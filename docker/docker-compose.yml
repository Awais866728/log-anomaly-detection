name: log-anomaly

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: ./app
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-loguser}
      PGPASSWORD: ${POSTGRES_PASSWORD:-logpass}
      PGDATABASE: ${POSTGRES_DB:-logs}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logpass}
      POSTGRES_DB: ${POSTGRES_DB:-logs}
    ports:
      # 5433 on the host, since 5432 is often taken by another local Postgres
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ssh:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r2-ls243
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      USER_NAME: ${SSH_USER:-testuser}
      USER_PASSWORD: ${SSH_PASSWORD:-testpass}
      PASSWORD_ACCESS: "true"
      LOG_STDOUT: "true" # sshd logs go to docker compose logs
    ports:
      # localhost only, so the test server can't be reached from the network
      - "127.0.0.1:2222:2222"
    restart: unless-stopped

volumes:
  pgdata:
